[project]
name = "creatoros"
version = "0.1.0"
description = "CreatorOS — agentic recommendation system for Instagram Reels creators. Build Doc 1: data foundation."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "cryptography>=42.0",
    "qdrant-client>=1.9",
    "voyageai>=0.2.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "click>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "time-machine>=2.14",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live external service/credential (Postgres, Meta, Voyage, or Qdrant Cloud)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic's own templates (env.py, migration revisions) use Union/Sequence-style
# annotations for compatibility with older Python; keep them close to Alembic's
# generated conventions rather than reformatting generated/templated code.
"src/creatoros/migrations/**" = ["UP007", "UP006", "UP035", "I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creatoros"]
